<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Admin Dashboard</title>
    
    <link rel="manifest" href="manifest.json">

    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b111e;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .bg-card {
            background-color: #172031;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-200 min-h-screen p-4 flex flex-col justify-between select-none">

    <div class="w-full max-w-md mx-auto space-y-6">
        
        <div class="text-center mt-4">
            <h2 class="text-[11px] font-bold tracking-[0.2em] text-blue-500 uppercase">Admin Dashboard</h2>
            <h1 class="text-5xl font-black tracking-wide text-gray-300 mt-1">MAX</h1>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="abrirFormulario()" class="bg-card active:scale-95 transition-transform p-5 rounded-2xl flex flex-col items-center justify-center gap-2 border border-slate-800/40 shadow-lg text-left w-full">
                <div class="text-amber-500 text-xl bg-amber-500/10 w-10 h-10 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <span class="font-semibold text-sm text-gray-300">Venta</span>
            </button>

            <button onclick="abrirFormulario()" class="bg-card active:scale-95 transition-transform p-5 rounded-2xl flex flex-col items-center justify-center gap-2 border border-slate-800/40 shadow-lg text-left w-full">
                <div class="text-blue-400 text-xl bg-blue-500/10 w-10 h-10 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <span class="font-semibold text-sm text-gray-300">Clientes</span>
            </button>

            <button onclick="filtrarDeudores()" class="bg-card active:scale-95 transition-transform p-5 rounded-2xl flex flex-col items-center justify-center gap-2 border border-slate-800/40 shadow-lg text-left w-full">
                <div class="text-rose-400 text-xl bg-rose-500/10 w-10 h-10 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                </div>
                <span class="font-semibold text-sm text-gray-300">Deudores</span>
            </button>

            <button onclick="calcularBalance()" class="bg-card active:scale-95 transition-transform p-5 rounded-2xl flex flex-col items-center justify-center gap-2 border border-slate-800/40 shadow-lg text-left w-full">
                <div class="text-emerald-400 text-xl bg-emerald-500/10 w-10 h-10 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span class="font-semibold text-sm text-gray-300">Balance</span>
            </button>
        </div>

        <div class="space-y-3">
            <button onclick="verSeccion('Rendimiento Vendedores', 'Sección de analítica de ventas y rendimiento del personal autorizado.')" class="w-full bg-card active:scale-98 transition-transform px-4 py-4 rounded-xl flex items-center gap-4 border border-slate-800/30 shadow-md text-left">
                <i class="fa-solid fa-chart-line text-purple-400 text-lg w-6 text-center"></i>
                <span class="text-[11px] font-bold tracking-wider uppercase text-gray-300">Rendimiento Vendedores</span>
            </button>

            <button onclick="verSeccion('Gestión de Personal', 'Panel de control para altas, bajas y permisos de operarios del sistema.')" class="w-full bg-card active:scale-98 transition-transform px-4 py-4 rounded-xl flex items-center gap-4 border border-slate-800/30 shadow-md text-left">
                <i class="fa-solid fa-users-gear text-slate-400 text-lg w-6 text-center"></i>
                <span class="text-[11px] font-bold tracking-wider uppercase text-gray-300">Gestión de Personal</span>
            </button>

            <button onclick="mostrarHistorial()" class="w-full bg-card active:scale-98 transition-transform px-4 py-4 rounded-xl flex items-center gap-4 border border-slate-800/30 shadow-md text-left">
                <i class="fa-solid fa-list-ul text-slate-400 text-lg w-6 text-center"></i>
                <span class="text-[11px] font-bold tracking-wider uppercase text-gray-300">Historial de Actividad</span>
            </button>
        </div>

        <div class="bg-card rounded-2xl p-4 border border-slate-800/50 shadow-xl space-y-4">
            <div class="flex items-center justify-between text-blue-500">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-users text-base"></i>
                    <h3 id="panel-titulo" class="text-[12px] font-bold tracking-wider uppercase text-blue-500">Control de Vencimientos</h3>
                </div>
                <button onclick="listarTodos()" class="text-[10px] bg-slate-800 px-2 py-1 rounded text-gray-400 font-bold uppercase active:scale-95">Ver Todos</button>
            </div>

            <div class="w-full text-left text-[11px]">
                <div class="grid grid-cols-3 text-slate-500 font-bold tracking-wider mb-2 px-1">
                    <div>CLIENTE</div>
                    <div class="text-center">F. INGRESO</div>
                    <div class="text-right">F. EXPIRACIÓN</div>
                </div>
                <div class="h-px bg-slate-800/60 my-2"></div>
                
                <div id="tabla-cuerpo" class="space-y-3 max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <div id="formulario-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-card w-full max-w-sm rounded-2xl p-5 border border-slate-700/50 shadow-2xl space-y-4">
            <h3 class="text-md font-bold text-gray-200 uppercase tracking-wider"><i class="fa-solid fa-cash-register text-amber-500 mr-2"></i>Nueva Operación</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Nombre del Cliente</label>
                    <input type="text" id="reg-nombre" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500" placeholder="Ej. Carlos Rodriguez">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Monto ($)</label>
                        <input type="number" id="reg-monto" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Fecha de Ingreso</label>
                        <input type="date" id="reg-fecha" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-gray-200 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="reg-debe" class="w-4 h-4 accent-rose-500 rounded bg-slate-900 border-slate-700">
                    <label for="reg-debe" class="text-xs font-bold text-rose-400">Registrar como Deuda (No pagó)</label>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="cerrarFormulario()" class="w-1/2 bg-slate-800 text-gray-300 text-sm font-semibold py-2 rounded-xl">Cancelar</button>
                <button onclick="ejecutarRegistro()" class="w-1/2 bg-blue-600 text-white text-sm font-semibold py-2 rounded-xl">Guardar</button>
            </div>
        </div>
    </div>

    <div id="info-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-card w-full max-w-sm rounded-2xl p-5 border border-slate-700/50 shadow-2xl space-y-4">
            <h3 id="info-titulo" class="text-sm font-bold tracking-wider text-blue-400 uppercase"></h3>
            <div id="info-contenido" class="text-xs text-slate-300 space-y-2"></div>
            <button onclick="cerrarInfo()" class="w-full bg-slate-800 text-gray-300 text-sm font-semibold py-2 rounded-xl">Cerrar</button>
        </div>
    </div>

    <audio id="campanita" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav" preload="auto"></audio>

    <script>
        // Inicializar base de datos interna local
        if (!localStorage.getItem('db_clientes')) localStorage.setItem('db_clientes', JSON.stringify([]));
        if (!localStorage.getItem('db_historial')) localStorage.setItem('db_historial', JSON.stringify([]));

        document.getElementById('reg-fecha').valueAsDate = new Date();
        document.addEventListener('DOMContentLoaded', listarTodos);

        function abrirFormulario() { document.getElementById('formulario-modal').classList.remove('hidden'); }
        function cerrarFormulario() { document.getElementById('formulario-modal').classList.add('hidden'); }
        function cerrarInfo() { document.getElementById('info-modal').classList.add('hidden'); }

        function registrarLog(msg) {
            let hist = JSON.parse(localStorage.getItem('db_historial')) || [];
            let tiempo = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            hist.unshift({ accion: msg, hora: tiempo });
            localStorage.setItem('db_historial', JSON.stringify(hist));
        }

        function ejecutarRegistro() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const monto = parseFloat(document.getElementById('reg-monto').value) || 0;
            const fechaIngresoRaw = document.getElementById('reg-fecha').value;
            const esDeuda = document.getElementById('reg-debe').checked;

            if (!nombre || !fechaIngresoRaw) {
                alert('Completá el nombre y la fecha para registrar.');
                return;
            }

            // Formatear fecha ingreso
            const p = fechaIngresoRaw.split('-');
            const fIngreso = `${p[2]}/${p[1]}/${p[0]}`;

            // Calcular +30 días exacta
            const fExp = new Date(fechaIngresoRaw);
            fExp.setDate(fExp.getDate() + 30);
            const fExpiracion = `${String(fExp.getDate()).padStart(2,'0')}/${String(fExp.getMonth()+1).padStart(2,'0')}/${fExp.getFullYear()}`;

            // Insertar registro en base local
            let clientes = JSON.parse(localStorage.getItem('db_clientes'));
            clientes.unshift({ id: Date.now(), nombre, fIngreso, fExpiracion, monto, esDeuda });
            localStorage.setItem('db_clientes', JSON.stringify(clientes));

            registrarLog(`Alta: ${nombre} | $${monto} (${esDeuda ? 'Deuda' : 'Cobrado'})`);

            // Ejecutar campana
            const audio = document.getElementById('campanita');
            audio.currentTime = 0;
            audio.play().catch(()=>{});

            // Limpiar formulario
            document.getElementById('reg-nombre').value = '';
            document.getElementById('reg-monto').value = '0';
            document.getElementById('reg-debe').checked = false;

            cerrarFormulario();
            listarTodos();
        }

        function listarTodos() {
            document.getElementById('panel-titulo').innerText = "Control de Vencimientos";
            const cuerpo = document.getElementById('tabla-cuerpo');
            let clientes = JSON.parse(localStorage.getItem('db_clientes')) || [];

            if (clientes.length === 0) {
                cuerpo.innerHTML = `<div class="text-center text-slate-600 py-6 text-xs font-semibold">No hay clientes registrados en tu base local.</div>`;
                return;
            }

            cuerpo.innerHTML = clientes.map(c => `
                <div onclick="gestionarCliente(${c.id}, '${c.nombre}')" class="grid grid-cols-3 items-center py-1.5 border-b border-slate-800/30 active:bg-slate-900/50 rounded px-1 transition-colors">
                    <div class="truncate font-semibold text-sm ${c.esDeuda ? 'text-rose-400' : 'text-gray-300'}">${c.nombre}</div>
                    <div class="text-center text-slate-400">${c.fIngreso}</div>
                    <div class="text-right text-emerald-400 font-semibold">${c.fExpiracion}</div>
                </div>
            `).join('');
        }

        function gestionarCliente(id, nombre) {
            if (confirm(`¿Deseas eliminar a "${nombre}" del sistema de control?`)) {
                let clientes = JSON.parse(localStorage.getItem('db_clientes'));
                clientes = clientes.filter(c => c.id !== id);
                localStorage.setItem('db_clientes', JSON.stringify(clientes));
                registrarLog(`Baja de cliente: ${nombre}`);
                listarTodos();
            }
        }

        function filtrarDeudores() {
            document.getElementById('panel-titulo').innerText = "Filtro: Cuentas Pendientes";
            const cuerpo = document.getElementById('tabla-cuerpo');
            let clientes = JSON.parse(localStorage.getItem('db_clientes')) || [];
            let deudores = clientes.filter(c => c.esDeuda);

            if (deudores.length === 0) {
                cuerpo.innerHTML = `<div class="text-center text-emerald-400 py-6 text-xs font-bold uppercase">¡Cuentas limpias! No hay deudores.</div>`;
                return;
            }

            cuerpo.innerHTML = deudores.map(c => `
                <div class="grid grid-cols-3 items-center py-2 border-b border-slate-800/30">
                    <div class="truncate font-semibold text-sm text-rose-400">${c.nombre}</div>
                    <div class="text-center text-slate-500 font-medium">Saldo deudor:</div>
                    <div class="text-right text-rose-500 font-black text-sm">$${c.monto}</div>
                </div>
            `).join('');
        }

        function calcularBalance() {
            let clientes = JSON.parse(localStorage.getItem('db_clientes')) || [];
            let ingresos = clientes.filter(c => !c.esDeuda).reduce((sum, c) => sum + c.monto, 0);
            let deudas = clientes.filter(c => c.esDeuda).reduce((sum, c) => sum + c.monto, 0);

            document.getElementById('info-titulo').innerText = "Balance Operativo de Caja";
            document.getElementById('info-contenido').innerHTML = `
                <div class="flex justify-between border-b border-slate-800 pb-2">
                    <span class="text-slate-400 font-medium">Capital Cobrado:</span>
                    <span class="text-emerald-400 font-bold">$${ingresos}</span>
                </div>
                <div class="flex justify-between border-b border-slate-800 py-2">
                    <span class="text-slate-400 font-medium">Cuentas por Cobrar:</span>
                    <span class="text-rose-400 font-bold">$${deudas}</span>
                </div>
                <p class="text-[10px] text-slate-500 pt-2 leading-tight">Los montos se calculan de manera autónoma sumando los registros vigentes almacenados en la memoria de este navegador.</p>
            `;
            document.getElementById('info-modal').classList.remove('hidden');
        }

        function mostrarHistorial() {
            document.getElementById('panel-titulo').innerText = "Historial de Cambios";
            const cuerpo = document.getElementById('tabla-cuerpo');
            let historial = JSON.parse(localStorage.getItem('db_historial')) || [];

            if (historial.length === 0) {
                cuerpo.innerHTML = `<div class="text-center text-slate-600 py-6 text-xs">No hay actividad registrada hoy.</div>`;
                return;
            }

            cuerpo.innerHTML = historial.slice(0, 20).map(h => `
                <div class="grid grid-cols-3 items-center py-1.5 border-b border-slate-800/10 text-slate-400 text-xs">
                    <div class="col-span-2 truncate font-medium">${h.accion}</div>
                    <div class="text-right text-[10px] text-blue-400 font-bold">${h.hora} hs</div>
                </div>
            `).join('');
        }

        function verSeccion(titulo, info) {
            document.getElementById('info-titulo').innerText = titulo;
            document.getElementById('info-contenido').innerHTML = `<p class="text-slate-400 leading-relaxed">${info}</p>`;
            document.getElementById('info-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
